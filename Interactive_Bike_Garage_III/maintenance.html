<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Bike Garage">

    <meta property="og:title" content="Interactive Bike Garage III">
    <meta property="og:description" content="Interactive Bike Garage III">

    <meta name="author" content="Emile Bedard">
    <meta name="copyright" content="copyright Emile Bedard, CART 353, 2026">

    <title>Interactive Bike Garage III</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- CSS Stylesheets-->
    <link rel="stylesheet" href="styling/IBG_styles.css">


    <!-- local seven points font-->
    <link rel="preload" href="assets/SevenPoints.woff2" as="font" type="font/woff2" crossorigin>

    <!-- local space mono font-->
    <link rel="preload" href="assets/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/SpaceMono-Bold.woff2" as="font" type="font/woff2" crossorigin>

    <!--THREE JS-->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
      }
    }
    </script>

    <!-- My js scripts-->
    <script src="js/pointer.js"></script>

    <!-- Three.js 3D scene-->
    <script type="module" src="js/InteractiveBikeGarage3-ThreeJS.js"></script>

    <!-- Node Terminal line for browser synced prototyping 
     npx browser-sync start --server --files "**/*.html, **/*.css, **/*.js"
    -->
</head>

<body>

    <div class="fixed-spotLight"></div>


    <!-- Index button to go back to main page-->
    <div class="banner-buttons">
        <a href="index.html">
            <button id="registerPartsButton">index</button>
        </a>
    </div>

    <div id="canvas-container">
        <!-- canvas for three.js-->
        <canvas id="three-ex"></canvas>
    </div>

    <div class="maintenance-main-zone">

        <a id="chain-button" class="button">
            <p>REROUTE<br> your chain</p>
            <svg>
                <circle class="svg-circle" pathLength="100" />
            </svg>
        </a>

        <a id="innertube-button" class="button">
            <p>REPAIR<br> a flat tire</p>
            <svg>
                <circle class="svg-circle" pathLength="100" />
            </svg>
        </a>

        <a id="pads-button" class="button">
            <p>CHANGE<br> your brake pads</p>
            <svg>
                <circle class="svg-circle" pathLength="100" />
            </svg>
        </a>

    </div>

    <div class="maintenance-imgs-zone">

        <a id="menu-button" class="button" href="index.html">
            <p>MAIN MENU</p>
            <svg>
                <circle class="svg-circle" pathLength="100" />
            </svg>
        </a>

        <img id="chain-img" src="assets/maint-overlay1-reroute-chain.png" alt="">
        <img id="innertube-img" src="assets/maint-overlay2-replace-your-inner-tube.png" alt="">
        <img id="pads-img" src="assets/maint-overlay3-replace-your-brake-pads.png" alt="">

        <a id="return-button" class="button" href="maintenance.html">
            <p>RETURN<br>to tips</p>
            <svg>
                <circle class="svg-circle" pathLength="100" />
            </svg>
        </a>

    </div>

</body>

</html>
