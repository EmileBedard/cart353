<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Bike Garage">

    <meta property="og:title" content="Interactive Bike Garage">
    <meta property="og:description" content="Interactive Bike Garage">

    <meta name="author" content="Emile Bedard">
    <meta name="copyright" content="copyright Emile Bedard, project 2 CART 263, 2025">

    <title>Interactive Bike Garage III</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Stylesheets-->
    <link rel="stylesheet" href="styling/leaflet.css">
    <link rel="stylesheet" href="styling/maplibre-gl.css">
    <link rel="stylesheet" href="styling/IBG_styles.css">
    <link rel="stylesheet" href="styling/IBG_mobile.css">

    <!-- Space mono font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- Leaflet & MapLibre Offline Libraries -->
    <script src="assets/leaflet.js"></script>
    <script src="assets/maplibre-gl.js"></script>
    <script src="assets/leaflet-maplibre-gl.js"></script>
    <script src="assets/pmtiles.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="js/InteractiveBikeGarage2-ThreeJS.js"></script>

    <style>
        /* Circular Map Widget Container */
        #map-circle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 3px solid #ffffff;
            z-index: 10;
            /* Keeps it above Three.js canvas */
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>

</head>

<body>
    <!-- top banner for title and menu button-->
    <nav style="position: relative; z-index: 20;">
        <div class="banner">
            <a href="index.html">
                <h3>Interactive Bike Garage</h3>
            </a>
            <div class="banner-buttons">
                <a href="parts_registry.html">
                    <button id="registerPartsButton">register parts</button>
                </a>
                <a href="maintenance.html">
                    <button id="maintenanceButton">maintenance</button>
                </a>
            </div>
        </div>
    </nav>

    <!-- Background Three.js Canvas -->
    <div id="canvas-container">
        <canvas id="three-ex" style="width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Circular Montreal Map Overlay -->
    <div id="map-circle-container">
        <div id="map"></div>
    </div>

    <!-- Initialize Offline Map inside Circle -->
    <script>
        // 1. Register PMTiles protocol handler
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        // 2. Initialize Leaflet map centered over Montreal
        const map = L.map('map', {
            zoomControl: false // Optional: hides default zoom buttons for a clean aesthetic
        }).setView([45.5017, -73.5673], 12);

        // 3. Fetch local greybeard style JSON
        fetch('assets/greybeard.json')
            .then(res => res.json())
            .then(style => {
                L.maplibreGL({
                    style: style
                }).addTo(map);

                // Re-evaluate container dimensions inside circle mask
                setTimeout(() => { map.invalidateSize(); }, 200);
            })
            .catch(err => console.error("Error loading greybeard style:", err));
    </script>

</body>

</html>
