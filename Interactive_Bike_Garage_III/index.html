<head>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Stylesheets-->
    <link rel="stylesheet" href="styling/leaflet.css">
    <link rel="stylesheet" href="styling/maplibre-gl.css">
    <link rel="stylesheet" href="styling/IBG_styles.css">
    <link rel="stylesheet" href="styling/IBG_mobile.css">

    <!-- Space mono font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- Leaflet & MapLibre Offline Libraries -->
    <script src="assets/leaflet.js"></script>
    <script src="assets/maplibre-gl.js"></script>
    <script src="assets/leaflet-maplibre-gl.js"></script>
    <script src="assets/pmtiles.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="js/InteractiveBikeGarage3-ThreeJS.js"></script>

</head>

<body>
    <!-- top banner for title and menu button-->
    <nav style="position: relative; z-index: 20;">
        <div class="banner">
            <a href="index.html">
                <h3>Interactive Bike Garage</h3>
            </a>
            <div class="banner-buttons">
                <a href="parts_registry.html">
                    <button id="registerPartsButton">register parts</button>
                </a>
                <a href="maintenance.html">
                    <button id="maintenanceButton">maintenance</button>
                </a>
            </div>
        </div>
    </nav>

    <!-- Background Three.js Canvas -->
    <div id="canvas-container">
        <canvas id="three-ex" style="width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Circular Montreal Map Overlay -->
    <div id="map-circle-container">
        <div id="map"></div>
    </div>


    <script>

        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        //Leaflet map centered over Montreal and disable controls
        const map = L.map('map', {
            zoomControl: false,
            dragging: false,
            scrollWheelZoom: false
        }).setView([45.5017, -73.5673], 12);

        // prototyping with fixed image ---

        // 2. Define geographic bounds to lock your export image over Montreal
        // Adjust these coordinates if your image covers a specific neighborhood
        // const imageBounds = [
        //     [45.4800, -73.6200], // South-West corner
        //     [45.5300, -73.5200]  // North-East corner
        // ];

        // 3. Add local exported JPEG image layer
        // L.imageOverlay('assets/map-export.svg', imageBounds).addTo(map);

        let maplibreLayer = null;
        let rotationAngle = 0;

        // Fetch local greybeard style JSON
        fetch('assets/greybeard.json')
            .then(res => res.json())
            .then(style => {
                L.maplibreGL({
                    style: style
                }).addTo(map);

                // Re-evaluate container dimensions inside circle mask
                setTimeout(() => { map.invalidateSize(); rotateMap() }, 200);
            })
            .catch(err => console.error("Error loading greybeard style:", err));


        //rotates the map slowly only if an instance of the map has already been created with script above
        function rotateMap() {
            if (maplibreLayer) {

                const glMap = maplibreLayer.getMaplibreMap();

                if (glMap) {

                    rotationAngle = (rotationAngle + 0.05) % 360; //slowly builds the angle and integers at 360deg for looping

                    // Set the heading/bearing of the vector map without animation easing
                    glMap.setBearing(rotationAngle, { animate: false });
                }
            }

            requestAnimationFrame(rotateMap);
        }
    </script>

</body>

</html>
