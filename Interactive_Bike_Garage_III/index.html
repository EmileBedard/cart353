<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Bike Garage">

    <meta property="og:title" content="Interactive Bike Garage">
    <meta property="og:description" content="Interactive Bike Garage">

    <meta name="author" content="Emile Bedard">
    <meta name="copyright" content="copyright Emile Bedard, CART 353, 2026">

    <title>Interactive Bike Garage III</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Stylesheets-->
    <link rel="stylesheet" href="styling/leaflet.css">
    <link rel="stylesheet" href="styling/maplibre-gl.css">
    <link rel="stylesheet" href="styling/IBG_styles.css">
    <link rel="stylesheet" href="styling/IBG_mobile.css">

    <!-- Space mono font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- Leaflet & MapLibre Offline Libraries -->
    <script src="assets/leaflet.js"></script>
    <script src="assets/maplibre-gl.js"></script>
    <script src="assets/leaflet-maplibre-gl.js"></script>
    <script src="assets/pmtiles.js"></script>
    <script src="js/pointer.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="js/InteractiveBikeGarage3-ThreeJS.js"></script>

</head>

<body>
    <!-- top banner for title and menu button-->
    <nav style="position: relative; z-index: 20;">
        <div class="banner">
            <a href="index.html">
                <h3>Interactive Bike Garage</h3>
            </a>
            <div class="banner-buttons">
                <a href="parts_registry.html">
                    <button id="registerPartsButton">register parts</button>
                </a>
                <a href="maintenance.html">
                    <button id="maintenanceButton">maintenance</button>
                </a>
            </div>
        </div>
    </nav>

    <!-- Background Three.js Canvas -->
    <div id="canvas-container">
        <canvas id="three-ex" style="width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Circular Montreal Map Overlay -->
    <div id="map-circle-container">
        <div id="map"></div>
    </div>


    <script>
        const lang = "english";

        // start the PMTiles protocol
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        // Initialize the native MapLibre GL Map
        const map = new maplibregl.Map({
            container: 'map',
            style: 'assets/greybeard.json', // change to my local greybeard with source to assets/montreal.pmtiles once I have it 
            center: [-73.5773, 45.4959], // Concordia EV building [lng, lat]
            zoom: 14,
            pitch: 70,
            bearing: 0,
            antialias: true,
            attributionControl: false
        });

        // variables for auto-rotation and can be later used to be controlled by IMU angle
        let rotationAngle = 0;
        let isRotating = true;


        map.on('load', () => {

            fetch('js/shops.geojson')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Could not load shops.geojson: ${response.status}`);
                    }
                    return response.json();
                })
                .then(geojson => {
                    map.addSource('bike-shops', {
                        type: 'geojson',
                        data: geojson
                    });

                    map.addLayer({
                        id: 'bike-shops-layer',
                        type: 'circle',
                        source: 'bike-shops',
                        paint: {
                            'circle-radius': 5,
                            'circle-color': '#ff5722',
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#ffffff'
                        }
                    });

                    geojson.features.forEach(feature => {
                        if (feature.geometry?.type !== 'Point') return;

                        const properties = feature.properties || {};

                        let name = "";
                        if (lang !== "english") {
                            name = properties.fr_name;
                        }
                        else {
                            name = properties.en_name;
                        }

                        const content = document.createElement('div');
                        const title = document.createElement('strong');

                        title.textContent = name;
                        content.appendChild(title);



                        new maplibregl.Popup({
                            closeButton: false,
                            closeOnClick: false,
                            className: 'shop-popup'
                        })
                            .setLngLat(feature.geometry.coordinates)
                            .setDOMContent(content)
                            .addTo(map);
                    });
                })
                .catch(error => console.error('Failed to load bike shop data:', error));

            // resize just to be sure and start auto rotation
            map.resize();
            rotateMap();
        });

        //Smooth slow-rotation
        function rotateMap() {
            if (isRotating) {
                rotationAngle = (rotationAngle + 0.05) % 360;
                map.setBearing(rotationAngle);
            }
            requestAnimationFrame(rotateMap);
        }

        // ways to stop the auto rotation
        map.on('mousedown', () => { isRotating = false; });
        map.on('touchstart', () => { isRotating = false; });
    </script>

</body>

</html>
